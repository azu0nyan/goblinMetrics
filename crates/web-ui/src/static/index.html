<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoblinMetrics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.5rem;background:#1a1d27;border-bottom:1px solid #2d3148}
header h1{font-size:1.25rem;font-weight:700;color:#a78bfa;letter-spacing:.05em}
.controls{display:flex;gap:.75rem;align-items:center}
select{background:#252836;color:#e2e8f0;border:1px solid #3d4166;border-radius:.375rem;padding:.35rem .6rem;font-size:.85rem;cursor:pointer}
select:focus{outline:2px solid #7c3aed}
.badge{font-size:.75rem;padding:.2rem .5rem;border-radius:.25rem;background:#252836;color:#94a3b8}
main{padding:1.5rem;display:grid;gap:1.5rem}
.section-title{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#7c3aed;margin-bottom:.75rem}
.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1rem}
.card{background:#1a1d27;border:1px solid #2d3148;border-radius:.5rem;padding:1rem}
.card h3{font-size:.85rem;font-weight:600;color:#94a3b8;margin-bottom:.75rem}
.chart-wrap{position:relative;height:180px}
table{width:100%;border-collapse:collapse;font-size:.82rem}
th{text-align:left;color:#64748b;font-weight:500;padding:.4rem .6rem;border-bottom:1px solid #2d3148}
td{padding:.4rem .6rem;border-bottom:1px solid #1e2235;color:#cbd5e1}
td:last-child{text-align:right;color:#a78bfa;font-weight:600}
tr:hover td{background:#1e2235}
.status-ok{color:#34d399}
.status-warn{color:#fbbf24}
.status-err{color:#f87171}
.loading{color:#475569;font-size:.85rem;text-align:center;padding:2rem}
</style>
</head>
<body>
<header>
  <h1>⚙ GoblinMetrics</h1>
  <div class="controls">
    <span class="badge" id="last-update">–</span>
    <select id="range-select" title="Time range">
      <option value="1">Last 1 h</option>
      <option value="6">Last 6 h</option>
      <option value="24">Last 24 h</option>
    </select>
    <select id="refresh-select" title="Auto-refresh">
      <option value="5">Refresh 5 s</option>
      <option value="10">Refresh 10 s</option>
      <option value="30">Refresh 30 s</option>
      <option value="60">Refresh 60 s</option>
      <option value="0">Refresh Off</option>
    </select>
  </div>
</header>
<main>
  <div>
    <div class="section-title">System</div>
    <div class="charts-row">
      <div class="card"><h3>CPU Usage %</h3><div class="chart-wrap"><canvas id="cpu-chart"></canvas></div></div>
      <div class="card"><h3>Memory Used %</h3><div class="chart-wrap"><canvas id="mem-chart"></canvas></div></div>
      <div class="card"><h3>Load Average (1m)</h3><div class="chart-wrap"><canvas id="load-chart"></canvas></div></div>
    </div>
  </div>
  <div>
    <div class="section-title">Nginx Requests</div>
    <div class="charts-row">
      <div class="card"><h3>Requests / min</h3><div class="chart-wrap"><canvas id="req-chart"></canvas></div></div>
      <div class="card"><h3>Status Codes</h3><div class="chart-wrap"><canvas id="status-chart"></canvas></div></div>
    </div>
    <div class="charts-row" style="margin-top:1rem">
      <div class="card" style="grid-column:1/-1">
        <h3>Top URLs</h3>
        <table id="url-table">
          <thead><tr><th>URL</th><th>Requests</th></tr></thead>
          <tbody><tr><td colspan="2" class="loading">Loading…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script>
const COLORS = {
  purple: 'rgba(124,58,237,.85)',
  green:  'rgba(52,211,153,.85)',
  yellow: 'rgba(251,191,36,.85)',
  red:    'rgba(248,113,113,.85)',
  blue:   'rgba(96,165,250,.85)',
  cyan:   'rgba(34,211,238,.85)',
};
const PIE_COLORS = ['#34d399','#60a5fa','#fbbf24','#f87171','#a78bfa','#fb923c'];
const GRID = {color:'rgba(255,255,255,.05)'};
const TICK = {color:'#64748b',font:{size:10}};

function lineChart(id, label, color) {
  const ctx = document.getElementById(id).getContext('2d');
  return new Chart(ctx, {
    type: 'line',
    data: {labels: [], datasets: [{label, data: [], borderColor: color,
      backgroundColor: color.replace('.85)', '.15)'), borderWidth: 1.5,
      pointRadius: 0, tension: 0.3, fill: true}]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {legend:{display:false}},
      scales: {
        x: {grid: GRID, ticks: {...TICK, maxTicksLimit: 6}},
        y: {grid: GRID, ticks: TICK, beginAtZero: true}
      }
    }
  });
}

function barChart(id, label, color) {
  const ctx = document.getElementById(id).getContext('2d');
  return new Chart(ctx, {
    type: 'bar',
    data: {labels: [], datasets: [{label, data: [], backgroundColor: color, borderRadius: 2}]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {legend:{display:false}},
      scales: {
        x: {grid: GRID, ticks: {...TICK, maxTicksLimit: 8}},
        y: {grid: GRID, ticks: TICK, beginAtZero: true}
      }
    }
  });
}

function pieChart(id) {
  const ctx = document.getElementById(id).getContext('2d');
  return new Chart(ctx, {
    type: 'doughnut',
    data: {labels: [], datasets: [{data: [], backgroundColor: PIE_COLORS, borderWidth: 1, borderColor: '#1a1d27'}]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: {legend:{position:'right', labels:{color:'#94a3b8', font:{size:11}, boxWidth:12}}}
    }
  });
}

const charts = {
  cpu:    lineChart('cpu-chart',  'CPU %',        COLORS.purple),
  mem:    lineChart('mem-chart',  'Mem Used %',   COLORS.green),
  load:   lineChart('load-chart', 'Load Avg 1m',  COLORS.cyan),
  req:    barChart ('req-chart',  'Req/min',      COLORS.blue),
  status: pieChart ('status-chart'),
};

function fmtTime(ms) {
  const d = new Date(ms);
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0');
}

function updateLine(chart, points, valueFn) {
  chart.data.labels   = points.map(p => fmtTime(p.timestamp));
  chart.data.datasets[0].data = points.map(valueFn);
  chart.update('none');
}

async function fetchJSON(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.statusText);
  return r.json();
}

function hours() { return document.getElementById('range-select').value; }

async function refresh() {
  const h = hours();
  try {
    const [cpu, mem, load, ts, sc, tu] = await Promise.all([
      fetchJSON(`/api/metrics?name=cpu_usage_pct&hours=${h}`),
      fetchJSON(`/api/metrics?name=memory_used_pct&hours=${h}`),
      fetchJSON(`/api/metrics?name=load_avg_1m&hours=${h}`),
      fetchJSON(`/api/requests/timeseries?hours=${h}`),
      fetchJSON(`/api/requests/status_codes?hours=${h}`),
      fetchJSON(`/api/requests/top_urls?hours=${h}&limit=10`),
    ]);

    updateLine(charts.cpu,  cpu,  p => p.value.toFixed(1));
    updateLine(charts.mem,  mem,  p => p.value.toFixed(1));
    updateLine(charts.load, load, p => p.value.toFixed(2));

    charts.req.data.labels = ts.map(p => fmtTime(p.bucket_ts));
    charts.req.data.datasets[0].data = ts.map(p => p.count);
    charts.req.update('none');

    charts.status.data.labels = sc.map(p => String(p.status_code));
    charts.status.data.datasets[0].data = sc.map(p => p.count);
    charts.status.update('none');

    const tbody = document.querySelector('#url-table tbody');
    if (tu.length === 0) {
      tbody.innerHTML = '<tr><td colspan="2" class="loading">No data yet</td></tr>';
    } else {
      tbody.innerHTML = tu.map(r =>
        `<tr><td>${r.url}</td><td>${r.count.toLocaleString()}</td></tr>`
      ).join('');
    }

    document.getElementById('last-update').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.error('refresh error', e);
  }
}

let timer = null;
function scheduleRefresh() {
  if (timer) clearInterval(timer);
  const secs = parseInt(document.getElementById('refresh-select').value, 10);
  localStorage.setItem('goblin-refresh', secs);
  if (secs > 0) timer = setInterval(refresh, secs * 1000);
}

// Restore saved settings
const savedRefresh = localStorage.getItem('goblin-refresh');
if (savedRefresh) {
  const el = document.getElementById('refresh-select');
  const opt = [...el.options].find(o => o.value === savedRefresh);
  if (opt) el.value = savedRefresh;
}

document.getElementById('refresh-select').addEventListener('change', scheduleRefresh);
document.getElementById('range-select').addEventListener('change', refresh);

scheduleRefresh();
refresh();
</script>
</body>
</html>
