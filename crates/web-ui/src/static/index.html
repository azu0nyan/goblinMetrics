<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<base href="./"/>
<title>GoblinMetrics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#0f1117;color:#e2e8f0;min-height:100vh}

/* ── Header ── */
header{background:#1a1d27;border-bottom:1px solid #2d3148;padding:.75rem 1.25rem;display:flex;flex-direction:column;gap:.5rem}
.header-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
header h1{font-size:1.15rem;font-weight:700;color:#a78bfa;letter-spacing:.05em}
.controls{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}

/* Preset range buttons */
.range-btns{display:flex;gap:2px}
.range-btn{background:#252836;color:#94a3b8;border:1px solid #3d4166;border-radius:.3rem;padding:.3rem .55rem;font-size:.8rem;cursor:pointer;transition:background .15s}
.range-btn:hover{background:#2d3148}
.range-btn.active{background:#7c3aed;color:#fff;border-color:#7c3aed}

/* Custom range row */
.custom-row{display:none;align-items:center;gap:.5rem;flex-wrap:wrap}
.custom-row.open{display:flex}
.custom-row input[type=datetime-local]{background:#252836;color:#e2e8f0;border:1px solid #3d4166;border-radius:.3rem;padding:.3rem .5rem;font-size:.8rem;color-scheme:dark}
.apply-btn{background:#7c3aed;color:#fff;border:none;border-radius:.3rem;padding:.3rem .7rem;font-size:.8rem;cursor:pointer}
.apply-btn:hover{background:#6d28d9}

select{background:#252836;color:#e2e8f0;border:1px solid #3d4166;border-radius:.375rem;padding:.3rem .55rem;font-size:.8rem;cursor:pointer}
.sep{color:#3d4166;font-size:.75rem;padding:0 .15rem}
.badge{font-size:.72rem;padding:.2rem .5rem;border-radius:.25rem;background:#252836;color:#64748b}

/* ── Layout ── */
main{padding:1.25rem;display:grid;gap:1.25rem}
.section-title{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:#7c3aed;margin-bottom:.6rem}
.charts-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:.75rem}
.card{background:#1a1d27;border:1px solid #2d3148;border-radius:.5rem;padding:.9rem}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.6rem}
.card h3{font-size:.82rem;font-weight:600;color:#94a3b8}
.chart-wrap{position:relative;height:175px}

/* ── Table ── */
.table-card{background:#1a1d27;border:1px solid #2d3148;border-radius:.5rem;padding:.9rem;margin-top:.75rem}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{text-align:left;color:#64748b;font-weight:500;padding:.4rem .6rem;border-bottom:1px solid #2d3148}
td{padding:.35rem .6rem;border-bottom:1px solid #1e2235;color:#cbd5e1;word-break:break-all}
td:last-child{text-align:right;color:#a78bfa;font-weight:600;word-break:normal;white-space:nowrap}
tr:hover td{background:#1e2235}
.show-btn{background:transparent;color:#7c3aed;border:1px solid #4c1d95;border-radius:.3rem;padding:.25rem .6rem;font-size:.75rem;cursor:pointer;margin-top:.6rem}
.show-btn:hover{background:#2d1f4a}
.loading{color:#475569;font-size:.82rem;text-align:center;padding:1.5rem}
.type-btn{background:#252836;color:#94a3b8;border:1px solid #3d4166;border-radius:.3rem;padding:.15rem .4rem;font-size:.8rem;cursor:pointer;line-height:1}
.type-btn:hover{background:#2d3148}
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>⚙ GoblinMetrics</h1>
    <div class="controls">
      <!-- Range presets -->
      <div class="range-btns">
        <button class="range-btn active" data-h="1">1h</button>
        <button class="range-btn" data-h="6">6h</button>
        <button class="range-btn" data-h="24">24h</button>
        <button class="range-btn" data-h="168">7d</button>
        <button class="range-btn" id="custom-btn" data-h="">Custom</button>
      </div>
      <span class="sep">|</span>
      <!-- Bucket selector (shared for req-rate + status charts) -->
      <label style="font-size:.78rem;color:#64748b">Bucket</label>
      <select id="bucket-select">
        <option value="second">Per second</option>
        <option value="minute" selected>Per minute</option>
        <option value="hour">Per hour</option>
      </select>
      <span class="sep">|</span>
      <!-- Host filter -->
      <label style="font-size:.78rem;color:#64748b">Host</label>
      <select id="host-select"><option value="">All hosts</option></select>
      <span class="sep">|</span>
      <!-- Refresh -->
      <select id="refresh-select">
        <option value="5">Refresh 5s</option>
        <option value="10" selected>Refresh 10s</option>
        <option value="30">Refresh 30s</option>
        <option value="60">Refresh 60s</option>
        <option value="0">Refresh off</option>
      </select>
      <span class="badge" id="last-update">–</span>
    </div>
  </div>
  <!-- Custom date range row -->
  <div class="custom-row" id="custom-row">
    <label style="font-size:.78rem;color:#64748b">From</label>
    <input type="datetime-local" id="dt-from"/>
    <label style="font-size:.78rem;color:#64748b">To</label>
    <input type="datetime-local" id="dt-to"/>
    <button class="apply-btn" id="apply-btn">Apply</button>
  </div>
</header>

<main>
  <!-- System metrics -->
  <div>
    <div class="section-title">System</div>
    <div class="charts-row">
      <div class="card"><div class="card-head"><h3>CPU Usage %</h3></div><div class="chart-wrap"><canvas id="cpu-chart"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Memory Used %</h3></div><div class="chart-wrap"><canvas id="mem-chart"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Load Average (1m)</h3></div><div class="chart-wrap"><canvas id="load-chart"></canvas></div></div>
    </div>
  </div>

  <!-- Nginx request metrics -->
  <div>
    <div class="section-title">Nginx Requests</div>
    <div class="charts-row">
      <div class="card">
        <div class="card-head">
          <h3 id="req-title">Requests / min</h3>
          <button id="req-type-btn" class="type-btn" title="Toggle bar/line">▬</button>
        </div>
        <div class="chart-wrap"><canvas id="req-chart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h3 id="status-title">Status Codes / min</h3>
          <button id="status-type-btn" class="type-btn" title="Toggle bar/line">▬</button>
        </div>
        <div class="chart-wrap"><canvas id="status-chart"></canvas></div>
      </div>
    </div>

    <!-- Latency charts -->
    <div class="charts-row" style="margin-top:.75rem">
      <div class="card">
        <div class="card-head"><h3 id="latency-title">Avg Backend Latency (nginx logs)</h3></div>
        <div class="chart-wrap"><canvas id="latency-chart"></canvas></div>
      </div>
      <div class="card">
        <div class="card-head">
          <h3>Dashboard API Latency (UI-measured)</h3>
          <button id="api-clear-btn" class="type-btn" title="Clear history">⟲</button>
        </div>
        <div class="chart-wrap"><canvas id="api-latency-chart"></canvas></div>
      </div>
    </div>

    <!-- Top URLs + Top IPs tables -->
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:.75rem;margin-top:.75rem">
      <div class="table-card" style="margin-top:0">
        <div class="card-head"><h3>Top URLs</h3></div>
        <table id="url-table">
          <thead><tr><th>URL</th><th>Requests</th></tr></thead>
          <tbody><tr><td colspan="2" class="loading">Loading…</td></tr></tbody>
        </table>
        <button class="show-btn" id="url-toggle" style="display:none">Show all</button>
      </div>
      <div class="table-card" style="margin-top:0">
        <div class="card-head"><h3>Top IPs</h3></div>
        <table id="ip-table">
          <thead><tr><th>IP</th><th>Requests</th></tr></thead>
          <tbody><tr><td colspan="2" class="loading">Loading…</td></tr></tbody>
        </table>
        <button class="show-btn" id="ip-toggle" style="display:none">Show all</button>
      </div>
    </div>
  </div>
</main>

<script>
// ── Palette ───────────────────────────────────────────────────────────────────
const C = {
  purple: 'rgba(124,58,237,.85)',
  green:  'rgba(52,211,153,.85)',
  cyan:   'rgba(34,211,238,.85)',
  blue:   'rgba(96,165,250,.85)',
  yellow: 'rgba(251,191,36,.85)',
  red:    'rgba(248,113,113,.85)',
  grey:   'rgba(148,163,184,.7)',
};
const STATUS_COLORS = {
  '2': C.green, '3': C.blue, '4': C.yellow, '5': C.red,
};
function statusColor(code) {
  return STATUS_COLORS[String(code)[0]] || C.grey;
}
const ENDPOINT_PALETTE = [C.blue, C.green, C.yellow, C.cyan, C.red, C.purple, C.grey];
function endpointColor(i) { return ENDPOINT_PALETTE[i % ENDPOINT_PALETTE.length]; }

const GRID = {color:'rgba(255,255,255,.05)'};
const TICK = {color:'#64748b',font:{size:10}};

// ── State ─────────────────────────────────────────────────────────────────────
let range = { from: null, to: null, hours: 1 };
let cachedTopUrls = [];
let showAllUrls = false;
let cachedTopIps = [];
let showAllIps = false;
let reqType    = localStorage.getItem('goblin-req-type')    || 'bar';
let statusType = localStorage.getItem('goblin-status-type') || 'bar';

// Per-endpoint client-measured fetch durations: { '/api/metrics': [{ts, ms}, ...] }
const apiTimings = {};
const MAX_TIMINGS_PER_ENDPOINT = 60;

// ── Chart factories ───────────────────────────────────────────────────────────
function tooltipLabel(suffix, decimals = 2) {
  return { label: item => `${item.dataset.label}: ${+item.parsed.y.toFixed(decimals)}${suffix}` };
}

const HOVER = {mode:'index', intersect:false, axis:'x'};

function lineChart(id, label, color, suffix = '') {
  return new Chart(document.getElementById(id), {
    type: 'line',
    data: {labels:[], datasets:[{label, data:[], borderColor:color,
      backgroundColor:color.replace('.85)','.12)'), borderWidth:1.5,
      pointRadius:0, pointHoverRadius:4, tension:0.3, fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:HOVER,
      plugins:{legend:{display:false}, tooltip:{...HOVER, callbacks:tooltipLabel(suffix)}},
      scales:{x:{grid:GRID,ticks:{...TICK,maxTicksLimit:7}},
              y:{grid:GRID,ticks:TICK,beginAtZero:true}}}
  });
}

function barChart(id, label, color, suffix = '') {
  return new Chart(document.getElementById(id), {
    type:'bar',
    data:{labels:[],datasets:[{label,data:[],backgroundColor:color,borderRadius:2}]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:HOVER,
      plugins:{legend:{display:false}, tooltip:{...HOVER, callbacks:tooltipLabel(suffix, 0)}},
      scales:{x:{grid:GRID,ticks:{...TICK,maxTicksLimit:9}},
              y:{grid:GRID,ticks:TICK,beginAtZero:true}}}
  });
}

function stackedBarChart(id) {
  return new Chart(document.getElementById(id), {
    type:'bar',
    data:{labels:[],datasets:[]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:HOVER,
      plugins:{
        legend:{position:'right',labels:{color:'#94a3b8',font:{size:10},boxWidth:10}},
        tooltip:{...HOVER, callbacks:{label:item=>`${item.dataset.label}: ${item.parsed.y}`}},
      },
      scales:{
        x:{grid:GRID,ticks:{...TICK,maxTicksLimit:9},stacked:true},
        y:{grid:GRID,ticks:TICK,beginAtZero:true,stacked:true}
      }}
  });
}

function stackedLineChart(id) {
  return new Chart(document.getElementById(id), {
    type:'line',
    data:{labels:[],datasets:[]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:HOVER,
      plugins:{
        legend:{position:'right',labels:{color:'#94a3b8',font:{size:10},boxWidth:10}},
        tooltip:{...HOVER, callbacks:{label:item=>`${item.dataset.label}: ${item.parsed.y}`}},
      },
      scales:{
        x:{grid:GRID,ticks:{...TICK,maxTicksLimit:9},stacked:true},
        y:{grid:GRID,ticks:TICK,beginAtZero:true,stacked:true}
      },
      elements:{point:{radius:0,hoverRadius:4},line:{tension:0.3}}}
  });
}

function multiLineChart(id) {
  return new Chart(document.getElementById(id), {
    type:'line',
    data:{labels:[],datasets:[]},
    options:{responsive:true,maintainAspectRatio:false,animation:false,
      interaction:HOVER,
      plugins:{
        legend:{position:'right',labels:{color:'#94a3b8',font:{size:10},boxWidth:10}},
        tooltip:{...HOVER, callbacks:{label:item=>
          `${item.dataset.label}: ${item.parsed.y!=null?item.parsed.y.toFixed(1)+' ms':'–'}`}},
      },
      scales:{
        x:{grid:GRID,ticks:{...TICK,maxTicksLimit:9}},
        y:{grid:GRID,ticks:TICK,beginAtZero:true,
           title:{display:true,text:'ms',color:'#64748b',font:{size:10}}}
      },
      elements:{point:{radius:0,hoverRadius:4},line:{tension:0.3}}}
  });
}

const charts = {
  cpu:     lineChart('cpu-chart',  'CPU %',       C.purple, '%'),
  mem:     lineChart('mem-chart',  'Mem Used %',  C.green,  '%'),
  load:    lineChart('load-chart', 'Load Avg 1m', C.cyan,   ''),
  req:     reqType === 'bar'
             ? barChart('req-chart',  'Requests', C.blue, ' req')
             : lineChart('req-chart', 'Requests', C.blue, ' req'),
  status:     statusType === 'bar' ? stackedBarChart('status-chart') : stackedLineChart('status-chart'),
  latency:    lineChart('latency-chart',     'Avg', C.cyan, ' ms'),
  apiLatency: multiLineChart('api-latency-chart'),
};
document.getElementById('req-type-btn').textContent    = reqType    === 'bar' ? '▬' : '∿';
document.getElementById('status-type-btn').textContent = statusType === 'bar' ? '▬' : '∿';

// ── Helpers ───────────────────────────────────────────────────────────────────
function fmtLabel(ms, bms) {
  const d = new Date(ms);
  if (bms >= 3_600_000) {
    return d.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' ' +
           d.getHours().toString().padStart(2,'0') + ':00';
  }
  return d.getHours().toString().padStart(2,'0') + ':' +
         d.getMinutes().toString().padStart(2,'0') +
         (bms < 60_000 ? ':' + d.getSeconds().toString().padStart(2,'0') : '');
}

function bucketMs() {
  const b = document.getElementById('bucket-select').value;
  return b === 'second' ? 1000 : b === 'hour' ? 3_600_000 : 60_000;
}
function bucketLabel() {
  const b = document.getElementById('bucket-select').value;
  return b === 'second' ? 'req/s' : b === 'hour' ? 'req/h' : 'req/min';
}

function rangeParams() {
  const base = (range.from && range.to)
    ? `from=${range.from}&to=${range.to}`
    : `hours=${range.hours}`;
  const h = document.getElementById('host-select').value;
  return h ? `${base}&host=${encodeURIComponent(h)}` : base;
}

async function fetchJSON(url) {
  const start = performance.now();
  const r = await fetch(url);
  const ms = performance.now() - start;
  const endpoint = url.split('?')[0];
  if (!apiTimings[endpoint]) apiTimings[endpoint] = [];
  apiTimings[endpoint].push({ ts: Math.round(Date.now() / 1000) * 1000, ms });
  if (apiTimings[endpoint].length > MAX_TIMINGS_PER_ENDPOINT) apiTimings[endpoint].shift();
  if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
  return r.json();
}

function updateLine(chart, points) {
  const bms = bucketMs();
  chart.data.labels = points.map(p => fmtLabel(p.timestamp, bms));
  chart.data.datasets[0].data = points.map(p => p.value);
  chart.update('none');
}

// ── Status timeseries: build stacked datasets ─────────────────────────────────
function buildStatusDatasets(rows) {
  if (!rows.length) {
    charts.status.data.labels = [];
    charts.status.data.datasets = [];
    charts.status.update('none');
    return;
  }
  const bms = bucketMs();
  const buckets = [...new Set(rows.map(r => r.bucket_ts))].sort((a,b)=>a-b);
  const codes   = [...new Set(rows.map(r => r.status_code))].sort((a,b)=>a-b);
  const map = {};
  rows.forEach(r => { map[`${r.bucket_ts}_${r.status_code}`] = r.count; });
  charts.status.data.labels   = buckets.map(ts => fmtLabel(ts, bms));
  charts.status.data.datasets = codes.map(code => ({
    label: String(code),
    data:  buckets.map(ts => map[`${ts}_${code}`] || 0),
    backgroundColor: statusColor(code),
    borderColor:     statusColor(code),
    borderRadius: 1,
    borderWidth: 1.5,
    pointRadius: 0,
    tension: 0.3,
    fill: true,
  }));
  charts.status.update('none');
}

// ── Avg backend latency: single-line chart, aligned to RPS chart buckets ─────
function updateLatency(rows, refLabels, refBuckets) {
  const map = {};
  rows.forEach(r => { map[r.bucket_ts] = r.avg_ms; });
  charts.latency.data.labels = refLabels;
  charts.latency.data.datasets[0].data = refBuckets.map(ts => map[ts] ?? null);
  charts.latency.data.datasets[0].spanGaps = true;
  charts.latency.update('none');
}

// ── Dashboard API latency: client-measured timings, one line per endpoint ─────
function buildApiLatencyDatasets() {
  const endpoints = Object.keys(apiTimings).sort();
  if (!endpoints.length) {
    charts.apiLatency.data.labels   = [];
    charts.apiLatency.data.datasets = [];
    charts.apiLatency.update('none');
    return;
  }
  const tsSet = new Set();
  endpoints.forEach(ep => apiTimings[ep].forEach(p => tsSet.add(p.ts)));
  const allTs = [...tsSet].sort((a, b) => a - b);
  charts.apiLatency.data.labels = allTs.map(ts => fmtLabel(ts, 1000));
  charts.apiLatency.data.datasets = endpoints.map((ep, i) => {
    const map = {};
    apiTimings[ep].forEach(p => { map[p.ts] = p.ms; });
    const color = endpointColor(i);
    return {
      label:           ep.replace(/^\/?api\//, ''),
      data:            allTs.map(ts => map[ts] ?? null),
      borderColor:     color,
      backgroundColor: color.replace('.85)','.12)'),
      borderWidth: 1.5,
      pointRadius: 0,
      spanGaps: true,
    };
  });
  charts.apiLatency.update('none');
}

// ── Top URLs table ────────────────────────────────────────────────────────────
function renderUrls(rows) {
  const tbody = document.querySelector('#url-table tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="2" class="loading">No data yet</td></tr>';
    document.getElementById('url-toggle').style.display = 'none';
    return;
  }
  tbody.innerHTML = rows.map(r =>
    `<tr><td>${escHtml(r.url)}</td><td>${r.count.toLocaleString()}</td></tr>`
  ).join('');
}

// ── Top IPs table ─────────────────────────────────────────────────────────────
function renderIps(rows) {
  const tbody = document.querySelector('#ip-table tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="2" class="loading">No data yet</td></tr>';
    document.getElementById('ip-toggle').style.display = 'none';
    return;
  }
  tbody.innerHTML = rows.map(r =>
    `<tr><td>${escHtml(r.ip)}</td><td>${r.count.toLocaleString()}</td></tr>`
  ).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Main refresh ──────────────────────────────────────────────────────────────
async function refresh() {
  const rp  = rangeParams();
  const bkt = document.getElementById('bucket-select').value;

  try {
    const [cpu, mem, load, ts, stTs, tu, ti, lat] = await Promise.all([
      fetchJSON(`api/metrics?name=cpu_usage_pct&${rp}`),
      fetchJSON(`api/metrics?name=memory_used_pct&${rp}`),
      fetchJSON(`api/metrics?name=load_avg_1m&${rp}`),
      fetchJSON(`api/requests/timeseries?${rp}&bucket=${bkt}`),
      fetchJSON(`api/requests/status_timeseries?${rp}&bucket=${bkt}`),
      fetchJSON(`api/requests/top_urls?${rp}&limit=10`),
      fetchJSON(`api/requests/top_ips?${rp}&limit=10`),
      fetchJSON(`api/requests/latency?${rp}&bucket=${bkt}`),
    ]);

    updateLine(charts.cpu,  cpu);
    updateLine(charts.mem,  mem);
    updateLine(charts.load, load);

    const bms        = bucketMs();
    const reqBuckets = ts.map(p => p.bucket_ts);
    const reqLabels  = reqBuckets.map(b => fmtLabel(b, bms));
    charts.req.data.labels = reqLabels;
    charts.req.data.datasets[0].data = ts.map(p => p.count);
    charts.req.update('none');

    const lbl = bucketLabel();
    document.getElementById('req-title').textContent    = `Requests / ${lbl.replace('req/','')}`;
    document.getElementById('status-title').textContent = `Status Codes / ${lbl.replace('req/','')}`;

    buildStatusDatasets(stTs);
    updateLatency(lat, reqLabels, reqBuckets);
    buildApiLatencyDatasets();

    cachedTopUrls = tu;
    if (!showAllUrls) {
      renderUrls(tu);
      if (tu.length === 10) {
        const btn = document.getElementById('url-toggle');
        btn.textContent = 'Show all';
        btn.style.display = 'block';
      } else {
        document.getElementById('url-toggle').style.display = 'none';
      }
    }

    cachedTopIps = ti;
    if (!showAllIps) {
      renderIps(ti);
      if (ti.length === 10) {
        const btn = document.getElementById('ip-toggle');
        btn.textContent = 'Show all';
        btn.style.display = 'block';
      } else {
        document.getElementById('ip-toggle').style.display = 'none';
      }
    }

    document.getElementById('last-update').textContent =
      'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    console.error('refresh error', e);
  }
}

// ── Controls wiring ───────────────────────────────────────────────────────────

// Bar/line toggle — request rate
document.getElementById('req-type-btn').addEventListener('click', () => {
  const labels = charts.req.data.labels.slice();
  const data   = charts.req.data.datasets[0].data.slice();
  charts.req.destroy();
  reqType = reqType === 'bar' ? 'line' : 'bar';
  charts.req = reqType === 'bar'
    ? barChart('req-chart',  'Requests', C.blue, ' req')
    : lineChart('req-chart', 'Requests', C.blue, ' req');
  charts.req.data.labels = labels;
  charts.req.data.datasets[0].data = data;
  charts.req.update('none');
  document.getElementById('req-type-btn').textContent = reqType === 'bar' ? '▬' : '∿';
  localStorage.setItem('goblin-req-type', reqType);
});

// Bar/line toggle — status codes
document.getElementById('status-type-btn').addEventListener('click', () => {
  const labels   = charts.status.data.labels.slice();
  const datasets = charts.status.data.datasets.map(d => ({ ...d }));
  charts.status.destroy();
  statusType = statusType === 'bar' ? 'line' : 'bar';
  charts.status = statusType === 'bar' ? stackedBarChart('status-chart') : stackedLineChart('status-chart');
  charts.status.data.labels   = labels;
  charts.status.data.datasets = datasets;
  charts.status.update('none');
  document.getElementById('status-type-btn').textContent = statusType === 'bar' ? '▬' : '∿';
  localStorage.setItem('goblin-status-type', statusType);
});

// Clear dashboard API timing history
document.getElementById('api-clear-btn').addEventListener('click', () => {
  for (const k of Object.keys(apiTimings)) delete apiTimings[k];
  buildApiLatencyDatasets();
});

// Host filter
document.getElementById('host-select').addEventListener('change', () => {
  localStorage.setItem('goblin-host', document.getElementById('host-select').value);
  refresh();
});

async function populateHosts() {
  try {
    const hosts = await fetchJSON('api/requests/hosts');
    const sel   = document.getElementById('host-select');
    const saved = localStorage.getItem('goblin-host') || '';
    hosts.forEach(h => {
      const opt = document.createElement('option');
      opt.value = h; opt.textContent = h;
      if (h === saved) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch(e) { /* no hosts yet */ }
}

// Preset range buttons
document.querySelectorAll('.range-btn[data-h]').forEach(btn => {
  if (!btn.dataset.h) return;
  btn.addEventListener('click', () => {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('custom-row').classList.remove('open');
    range = { from: null, to: null, hours: parseFloat(btn.dataset.h) };
    refresh();
  });
});

// Custom button
document.getElementById('custom-btn').addEventListener('click', () => {
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('custom-btn').classList.add('active');
  const row = document.getElementById('custom-row');
  row.classList.toggle('open');
  const now  = new Date();
  const from = new Date(now - (range.hours || 1) * 3_600_000);
  document.getElementById('dt-to').value   = toDatetimeLocal(now);
  document.getElementById('dt-from').value = toDatetimeLocal(from);
});

// Apply custom range
document.getElementById('apply-btn').addEventListener('click', () => {
  const from = document.getElementById('dt-from').value;
  const to   = document.getElementById('dt-to').value;
  if (!from || !to) return;
  range = { from: new Date(from).getTime(), to: new Date(to).getTime(), hours: null };
  refresh();
});

// Bucket change
document.getElementById('bucket-select').addEventListener('change', () => {
  localStorage.setItem('goblin-bucket', document.getElementById('bucket-select').value);
  refresh();
});

// Refresh interval
let timer = null;
function scheduleRefresh() {
  if (timer) clearInterval(timer);
  const secs = parseInt(document.getElementById('refresh-select').value, 10);
  localStorage.setItem('goblin-refresh', secs);
  if (secs > 0) timer = setInterval(refresh, secs * 1000);
}
document.getElementById('refresh-select').addEventListener('change', scheduleRefresh);

// Show all / Show less URLs
document.getElementById('url-toggle').addEventListener('click', async () => {
  const btn = document.getElementById('url-toggle');
  if (!showAllUrls) {
    showAllUrls = true;
    btn.textContent = 'Fetching…';
    try {
      const all = await fetchJSON(`api/requests/top_urls?${rangeParams()}&limit=0`);
      renderUrls(all);
      btn.textContent = `Show less (${cachedTopUrls.length})`;
    } catch(e) {
      btn.textContent = 'Show all';
      showAllUrls = false;
    }
  } else {
    showAllUrls = false;
    renderUrls(cachedTopUrls);
    btn.textContent = 'Show all';
  }
});

// Show all / Show less IPs
document.getElementById('ip-toggle').addEventListener('click', async () => {
  const btn = document.getElementById('ip-toggle');
  if (!showAllIps) {
    showAllIps = true;
    btn.textContent = 'Fetching…';
    try {
      const all = await fetchJSON(`api/requests/top_ips?${rangeParams()}&limit=0`);
      renderIps(all);
      btn.textContent = `Show less (${cachedTopIps.length})`;
    } catch(e) {
      btn.textContent = 'Show all';
      showAllIps = false;
    }
  } else {
    showAllIps = false;
    renderIps(cachedTopIps);
    btn.textContent = 'Show all';
  }
});

// ── Util ──────────────────────────────────────────────────────────────────────
function toDatetimeLocal(d) {
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

// ── Restore saved prefs ───────────────────────────────────────────────────────
const savedBucket = localStorage.getItem('goblin-bucket');
if (savedBucket) {
  const el = document.getElementById('bucket-select');
  if ([...el.options].some(o => o.value === savedBucket)) el.value = savedBucket;
}
const savedRefresh = localStorage.getItem('goblin-refresh');
if (savedRefresh) {
  const el = document.getElementById('refresh-select');
  if ([...el.options].some(o => o.value === savedRefresh)) el.value = savedRefresh;
}

populateHosts();
scheduleRefresh();
refresh();
</script>
</body>
</html>
