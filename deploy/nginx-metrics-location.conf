# Mounts the GoblinMetrics dashboard at /goblin-metrics/ on goblin.geno.su.
# Included from the existing site config via:
#   include /etc/nginx/snippets/goblin-metrics.conf;

location = /goblin-metrics { return 301 /goblin-metrics/; }

location /goblin-metrics/ {
    auth_basic           "GoblinMetrics";
    auth_basic_user_file /etc/nginx/.goblin-metrics.htpasswd;

    proxy_pass http://127.0.0.1:4444/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
