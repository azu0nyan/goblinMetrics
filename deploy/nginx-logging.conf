# Drop this snippet into /etc/nginx/conf.d/goblin-metrics-logging.conf
# then add the two access_log lines to each server block in goblin.geno.su.

log_format goblin_json escape=json
    '{"remote_addr":"$remote_addr",'
    '"time_local":"$time_local",'
    '"request":"$request",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"accept":"$http_accept",'
    '"accept_language":"$http_accept_language",'
    '"x_forwarded_for":"$http_x_forwarded_for",'
    '"content_type":"$http_content_type",'
    '"host":"$host",'
    '"request_time":$request_time}';

# Add this line to both server blocks in /etc/nginx/sites-enabled/goblin.geno.su:
# access_log /var/log/nginx/goblin_metrics.log goblin_json;
